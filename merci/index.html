<meta name="claude:viewport-fit-sides" content="cover">
<title>Merci Express Pare-Brise</title>
<style>
/* Layout: one column on phones, a split hero on wide screens, then quiet sections with generous rhythm. */
:root {
  --bg: #F6F4EF;
  --surface: #FFFFFF;
  --ink: #0E1A2B;
  --muted: #4A5568;
  --accent: #0E2A47;
  --accent-ink: #FFFFFF;
  --line: #DCD8CE;
  --signal: #F2A900;
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "Instrument Sans", "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-x: hidden;
}
img { max-width: 100%; }
.wrap { max-width: 1080px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0 0 12px; font-weight: 600; }
h1 { font-size: clamp(2rem, 6vw, 3.4rem); letter-spacing: -0.01em; }
h2 { font-size: clamp(1.55rem, 4vw, 2.2rem); }
h3 { font-size: 1.15rem; font-family: var(--font-body); font-weight: 600; }
p { margin: 0 0 12px; max-width: 65ch; }
.eyebrow { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--accent); font-weight: 600; margin: 0 0 10px; }
.lead { font-size: 1.1rem; color: var(--muted); }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 18px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; font-weight: 700; letter-spacing: 0.02em; }
.brand .logo { height: 96px; width: auto; max-width: 100%; flex: none; display: block; mix-blend-mode: multiply; }
.topbar-nav { display: flex; justify-content: flex-end; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 12px; }
.band { background: transparent; margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand span { line-height: 1.1; }
.phone { color: var(--ink); text-decoration: none; font-weight: 600; }
.phone-badge { display: inline-flex; align-items: center; gap: 10px; background: #25D366; color: #FFFFFF; border-radius: 12px; padding: 8px 16px 8px 12px; text-decoration: none; }
.phone-badge svg { width: 34px; height: 34px; flex: none; }
.phone-badge strong { display: block; font-size: 1.3rem; line-height: 1.1; }
.phone-badge small { display: block; font-size: 0.8rem; line-height: 1.3; }
.phone-badge:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }

.hero { display: grid; gap: 32px; padding-block: 28px 56px; align-items: center; }
@media (min-width: 880px) { .hero { grid-template-columns: 1.05fr 0.95fr; padding-block: 48px 72px; } }
.cta-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 22px; }
.btn {
  display: inline-block; padding: 14px 22px; border-radius: 6px; font: inherit; font-weight: 600;
  text-decoration: none; border: 2px solid var(--accent); cursor: pointer; text-align: center;
}
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.hook { display: inline-flex; align-self: flex-start; font-size: 1.05rem; font-weight: 700; padding: 14px 24px; margin-bottom: 4px; }
.btn-wa { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: #25D366; border-color: #25D366; color: #FFFFFF; font-weight: 700; }
.btn-wa:hover { background: #1EBE5A; border-color: #1EBE5A; }
.btn-ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }
.reassure { margin-top: 18px; font-size: 0.92rem; color: var(--muted); }

.quote-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 24px; }
.quote-card h3 { margin-bottom: 4px; }
.quote-card form { display: grid; gap: 12px; margin-top: 14px; }
label { display: grid; gap: 4px; font-size: 0.9rem; color: var(--muted); }
input, select {
  font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 6px; padding: 11px 12px; width: 100%; min-width: 0;
}
.form-note { font-size: 0.85rem; color: var(--muted); margin: 0; }
.thanks { display: grid; gap: 10px; }
.thanks h3 { font-family: var(--font-display); font-size: 1.5rem; margin: 0; }
.consent-check { display: flex; gap: 10px; align-items: flex-start; font-size: 0.88rem; }
.consent-check input { width: auto; margin-top: 3px; }
.form-status { font-weight: 600; color: var(--accent); margin: 0; min-height: 1.4em; }

.strip { border-block: 1px solid var(--line); padding-block: 18px; font-size: 0.95rem; color: var(--muted); }
.strip .wrap { display: flex; flex-wrap: wrap; gap: 10px 28px; }

section.block { padding-block: 56px; }
.steps { display: grid; gap: 16px; margin-top: 28px; }
@media (min-width: 760px) { .steps { grid-template-columns: repeat(4, 1fr); } }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; min-width: 0; }
.step .tag { font-size: 0.8rem; color: var(--accent); font-weight: 600; margin: 0 0 6px; }

.benefits { display: grid; gap: 28px; margin-top: 28px; }
@media (min-width: 760px) { .benefits { grid-template-columns: 1fr 1fr; } }
.benefit { border-top: 2px solid var(--accent); padding-top: 14px; min-width: 0; }

.coverage { background: var(--surface); border-radius: 12px; padding: 28px; display: grid; gap: 20px; }
@media (min-width: 760px) { .coverage { grid-template-columns: 1fr 1fr; align-items: center; padding: 40px; } }
.zones { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
.zones li { border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 0.92rem; }

.faq details { border-bottom: 1px solid var(--line); padding-block: 14px; }
.faq summary { cursor: pointer; font-weight: 600; }
.faq details p { margin-top: 10px; color: var(--muted); }

.final { text-align: left; padding-block: 56px 72px; border-top: 1px solid var(--line); }
footer { border-top: 1px solid var(--line); padding-block: 22px; font-size: 0.85rem; color: var(--muted); }

.consent {
  position: fixed; z-index: 20; bottom: env(safe-area-inset-bottom, 0px);
  left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 560px; margin: 0 auto 12px; padding: 18px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
  display: grid; gap: 14px;
}
.consent p { margin: 0; font-size: 0.92rem; color: var(--muted); max-width: none; }
.consent a { color: var(--accent); }
.consent-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.consent-actions .btn { padding: 11px 12px; font-size: 0.95rem; }

/* Two-step quote form: questions appear one by one, with a progress scale and encouragement. */
.qf-top { display: grid; gap: 8px; }
.qf-cheer { font-family: var(--font-display); font-size: 1.2rem; margin: 0; color: var(--accent); }
.qf-scale { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
.qf-scale span { display: block; height: 100%; background: var(--accent); transition: width 0.4s ease; }
.qf-count { margin: 0; font-size: 0.82rem; color: var(--muted); }
.qf-step { display: grid; gap: 14px; }
.qf-q { display: grid; gap: 6px; min-width: 0; border: 0; margin: 0; padding: 0; animation: qf-in 0.35s ease both; }
.qf-q legend { font-size: 0.9rem; color: var(--muted); padding: 0; margin-bottom: 6px; }
.qf-radios { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.qf-radios label { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 6px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; color: var(--ink); font-size: 0.92rem; text-align: center; }
.qf-radios label:has(input:checked) { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.qf-radios input { width: auto; margin: 0; }
.qf-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.qf-actions .btn { flex: 1 1 140px; }
@keyframes qf-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .qf-q { animation: none; } }

/* Four-step form: a 4-segment scale, a small encouragement line, three fields per screen. */
.qf-cheer { font-family: inherit; font-size: 0.9rem; font-weight: 600; color: var(--accent); }
.qf-count { font-size: 0.78rem; }
.qf-scale { height: auto; background: none; border-radius: 0; overflow: visible; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.qf-scale span { display: block; height: 6px; background: var(--line); border-radius: 0; transition: background 0.3s ease; }
.qf-scale span.on { background: var(--accent); }

/* Answer choices: square, smaller, light grey. */
.qf-radios label { border-radius: 0; padding: 7px 4px; font-size: 0.85rem; background: #EEF0F2; color: #1F2937; border-color: #D5D9DE; }
.qf-radios label:has(input:checked) { background: #FFFFFF; border-color: var(--accent); }

/* Buttons: square corners. */
button, .btn {
  border-radius: 0 !important;
}

/* Logo and call button share one header row. */
.topbar-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-block: 12px; }
.topbar-row .phone-badge { margin-left: auto; }

/* Only these buttons get 15% corners. */
.cta-row .btn, .btn.btn-wa, button[data-next] {
  border-radius: 12px !important;
}

/* Call-to-action row above the process and benefits sections. */
.cta-band { padding-block: 40px 0; }

/* Site footer: contact block and legal links. */
.site-footer { background: #0E2A47; color: #F6F4EF; margin-top: 40px; padding-block: 40px 28px; margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.site-footer a { color: #F6F4EF; }
.site-footer h2, .site-footer .eyebrow { color: #F6F4EF; }
.site-footer .eyebrow { opacity: 0.75; }
.site-footer .legal-links { margin: 0; }
.footer-copy { color: #F6F4EF; opacity: 0.75; }
.footer-grid { display: grid; gap: 28px; }
@media (min-width: 760px) { .footer-grid { grid-template-columns: 1.2fr 1fr; } }
.footer-copy { font-size: 0.85rem; color: var(--muted); margin: 24px 0 0; }
.site-footer p { margin-bottom: 6px; }

/* Phone layout: tighter header, full-width actions, lighter section rhythm. */
@media (max-width: 559px) {
  h1 { font-size: 1.9rem; }
  .brand .logo { height: 68px; }
  .topbar-nav { justify-content: space-between; padding-block: 10px; }
  .topbar-nav .btn { padding: 10px 16px; }
  .phone-badge { padding: 6px 12px 6px 10px; }
  .phone-badge strong { font-size: 1.05rem; }
  .hero { padding-block: 20px 36px; }
  .cta-row .btn { flex: 1 1 100%; }
  .quote-card { padding: 20px; }
  .quote-card form { gap: 14px; }
  section.block { padding-block: 40px; }
  .coverage { padding: 22px; }
  .final { padding-block: 40px 56px; }
  .consent { bottom: 8px; padding: 14px; }
  .consent-actions .btn { font-size: 0.9rem; padding: 12px 10px; }
}

@media (prefers-reduced-motion: no-preference) {
  .hero > * { animation: rise 0.6s ease both; }
  .hero > *:nth-child(2) { animation-delay: 0.08s; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
}

.reminder { background: var(--surface); border: 1px dashed var(--accent); padding: 12px 16px; font-size: 0.9rem; margin: 24px 0; }
.back { margin-top: 8px; }
.home-link { text-align: right; margin: 16px 0 0; }
.home-link a { color: var(--accent); }

.legal-bar { background: #0E2A47; color: #F6F4EF; text-align: center; font-size: 0.85rem; padding: 14px 16px; margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); }
.legal-bar a { color: #F6F4EF; }
</style>
